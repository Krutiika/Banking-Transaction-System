spring.application.name=banking_platform
server.port=8000

spring.datasource.url=jdbc:mysql://localhost:3306/banking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

app.jwt.secret=${JWT_SECRET:banking-platform-development-secret-key-that-is-at-least-64-characters-long}
app.jwt.expiration-minutes=480

app.rabbitmq.exchange=${BANKING_EXCHANGE:banking.events.exchange}
app.rabbitmq.transaction-created-routing-key=${BANKING_TRANSACTION_CREATED_ROUTING_KEY:banking.transaction.created}
app.rabbitmq.transaction-queue=${BANKING_TRANSACTION_QUEUE:banking.transaction.queue}

spring.mvc.problemdetails.enabled=true
